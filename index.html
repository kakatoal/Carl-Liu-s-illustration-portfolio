<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carl Liu · Illustration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500&family=Macondo&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- One window, Gmail-style: top bar / list + detail / bottom bar -->
  <div class="shell">

    <header class="topbar">
      <a class="brand" href="#" id="brand">Carl Liu</a>
      <nav class="topnav" aria-label="Main">
        <button type="button" data-page="about" aria-pressed="false">About</button>
        <button type="button" data-page="contact" aria-pressed="false">Contact</button>
      </nav>
    </header>

    <main class="app" id="app">
      <section class="list-pane" aria-label="Works">
        <div class="filters" id="filters" aria-label="Categories"></div>
        <div class="list-scroll">
          <ol class="work-list" id="work-list"></ol>
        </div>
      </section>

      <article class="detail-pane" id="detail" aria-label="Details" aria-hidden="true" inert>
        <div class="detail-toolbar">
          <button class="icon-btn" id="close-btn" type="button" aria-label="Close">
            <svg class="icon-close" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="icon-back" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="detail-nav">
            <button class="icon-btn" id="prev-btn" type="button" aria-label="Previous work">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="detail-count" id="detail-count"></span>
            <button class="icon-btn" id="next-btn" type="button" aria-label="Next work">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="detail-scroll" id="detail-scroll">
          <div class="detail-content" id="detail-content"></div>
        </div>
      </article>
    </main>

    <footer class="bottombar">
      <span>© <span id="year"></span> Carl Liu</span>
      <span class="bottom-links">
        <a href="mailto:liuyuyang27@gmail.com" class="copy-email" title="Click to copy" aria-live="polite">liuyuyang27@gmail.com</a>
      </span>
    </footer>

  </div>

  <!-- About / Contact open in the detail pane -->
  <template id="page-about">
    <header class="detail-head">
      <h2 class="detail-title">About</h2>
      <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
    </header>
    <div class="page-body">
      <p>Hi, I'm Carl Liu, an illustrator and animator. I'm currently studying Art and Computation at the Rhode Island School of Design (RISD), class of 2028.</p>
    </div>
  </template>

  <template id="page-contact">
    <header class="detail-head">
      <h2 class="detail-title">Contact</h2>
      <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
    </header>
    <div class="page-body">
      <ul class="page-links">
        <li><a href="mailto:liuyuyang27@gmail.com" class="copy-email" title="Click to copy" aria-live="polite">liuyuyang27@gmail.com</a></li>
      </ul>
    </div>
  </template>

  <!-- Full-screen image viewer -->
  <dialog class="viewer" id="viewer" aria-label="Image viewer">
    <div id="viewer-body"></div>
    <button class="viewer-nav viewer-prev" type="button" data-step="-1" aria-label="Previous image">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="viewer-nav viewer-next" type="button" data-step="1" aria-label="Next image">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
